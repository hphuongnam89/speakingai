version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ielts-ai-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ornith-1.5:9b}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_ENABLED=${DEEPSEEK_ENABLED:-false}
      - PRONUNCIATION_ASSESSOR_URL=${PRONUNCIATION_ASSESSOR_URL:-}
      - API_KEY_ENABLED=true
      - API_KEY=${API_KEY:?Set API_KEY in .env to a random secret of at least 32 characters}
      - RATE_LIMIT_ENABLED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ielts-network

  ollama:
    image: ollama/ollama:latest
    container_name: ielts-ai-ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ielts-network

  ollama-model-init:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ornith-1.5:9b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ielts-network
    restart: "no"

  pronunciation-assessor:
    build:
      context: .
      dockerfile: docker/pronunciation/Dockerfile
    container_name: ielts-ai-pronunciation
    volumes:
      - pronunciation-models:/models
    restart: unless-stopped
    profiles:
      - pronunciation
    networks:
      - ielts-network

  # Optional production reverse proxy. Mount fullchain.pem and privkey.pem in ./docker/ssl.
  reverse-proxy:
    image: nginx:alpine
    container_name: ielts-ai-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - proxy
    networks:
      - ielts-network

volumes:
  ollama-models:
    name: ielts-ollama-models
  pronunciation-models:
    name: ielts-pronunciation-models

networks:
  ielts-network:
    name: ielts-ai-network
    driver: bridge
